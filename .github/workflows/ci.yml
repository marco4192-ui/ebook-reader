name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build 1/2: Server-Variante (standalone, mit API-Routen / KI-Funktionen)
      - name: Build (server mode with API routes)
        run: npm run build

      - name: Upload server build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: .next/standalone/
          retention-days: 7

      # Build 2/2: Statische Variante (GitHub Pages/Capacitor, ohne API-Routen).
      # Die App zeigt in dieser Variante einen ehrlichen Hinweis-Banner, dass
      # Server-Funktionen (KI, RSS-Abruf) nicht verfügbar sind.
      - name: Build (static export without API routes)
        run: npm run build:static

      - name: Upload static build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: out/
          retention-days: 7
